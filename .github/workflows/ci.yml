name: CI

on:
  push:
    branches: [main, feature/github-actions-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6389:6379
        options: >-
          --requirepass phase4-test-only-password
          --health-cmd "redis-cli -a phase4-test-only-password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          REDIS_TEST_HOST: 127.0.0.1
          REDIS_TEST_PORT: 6389
          REDIS_TEST_PASSWORD: phase4-test-only-password

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    env:
      REDIS_PASSWORD: github-actions-test-password
      GUEST_SESSION_SECRET: github-actions-test-secret-with-32-or-more-characters
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for frontend
        run: |
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost:3000/
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost:3000/api/ready

      - name: Verify Compose topology
        run: |
          docker compose ps
          test "$(docker compose config --services | wc -l)" -eq 3
          docker inspect realtime-chat-redis-1 --format '{{json .NetworkSettings.Ports}}' | grep -q '6379/tcp.*null'
          if docker exec realtime-chat-frontend-1 wget -q -T 2 -O /dev/null http://redis:6379 2>/dev/null; then
            echo "Frontend unexpectedly reached Redis" >&2
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down -v
