name: realtime-chat

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: realtime-chat-frontend:1.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - frontend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: realtime-chat-backend:1.0.0
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?Set GUEST_SESSION_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MESSAGE_HISTORY_LIMIT: ${MESSAGE_HISTORY_LIMIT:-100}
      MESSAGE_MAX_LENGTH: ${MESSAGE_MAX_LENGTH:-2000}
    expose:
      - "4000"
    networks:
      - frontend_net
      - redis_net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7.4.2-alpine
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - redis_net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  frontend_net:
    name: realtime-chat-frontend
    driver: bridge
  redis_net:
    name: realtime-chat-redis
    driver: bridge
    internal: true

volumes:
  redis_data:
    name: realtime-chat-redis-data